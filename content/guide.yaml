# THE CABIN — turnover guide. Single source of truth.
# Edit this file; `npm run build` regenerates the web app AND the print PDF.
# Schema: see README.md.
#
# DRAFT v0.2 (Claude, 2026-09-24) — every line drafted from Ben's 9/23 walkthrough of the old guide
# (content/dictation-2026-09-23-old-guide-walkthrough.md) and his 9/23 sweep answers. Nothing here
# goes to Savannah & Spencer until Ben has approved it line by line.
# Lines starting "⚠️ BEN:" are open questions / unverified — they RENDER on purpose so they can't be
# missed; delete each one as it's answered.
# Door codes are NEVER in this file (the repo and the web page are public) — see content/private/codes.md.
# photo: points at the planned final asset; a build warning "missing photo" = a shot still needed.
meta:
  title: The Cabin — Turnover Guide
  version: 0.2.0
  updated: 2026-09-24

sections:
  - id: before
    title: Before you start
    steps:
      - id: timing
        title: Know the window
        do:
          - Unless Ben says otherwise, you can start at 11am.
          - The next guest won't arrive before 2pm, but count on them arriving AT 2pm — everything must be done by then.
          - Turnover days and times are on the calendar Ben shares with you.
      - id: questions
        title: Ask if anything is unclear
        do:
          - Don't be afraid to ask questions. Text Ben any time.
          - "⚠️ BEN: how do they reach you while you are away — iMessage / WhatsApp / a number? Your phone number should NOT appear in the public web version; print-only or hand-written."

  - id: get-in
    title: Get in
    steps:
      - id: building-door
        title: Open the building's front door
        photo: photos/final/building-door-lock.jpg
        do:
          - Enter the code on the keypad, then press the button after it (the button is the part people miss).
          - "⚠️ BEN: code goes on the binder card / by text — not in this guide. Diagram of the lock + button still needed (you said you'd show it later)."
      - id: apartment-door
        title: Find the apartment
        do:
          - The apartment is the FIRST DOOR ON THE RIGHT — the first door you reach.
      - id: room-door
        title: Find the guest room
        photo: photos/final/unit-door-lock.jpg
        do:
          - Inside the apartment, the guest room is the door immediately to your LEFT.
          - The lantern outside the room's door should be lit RED.
          - Open the bolt lock on the door (the Level lock). It has to be open to get into the room.
        if:
          - when: the lantern is NOT lit red
            then: tell Ben.
      - id: door-screen
        title: Check the screen on the door
        photo: photos/final/door-screen-low-battery.jpg
        do:
          - The small screen on the door shows a low-battery indicator when it needs charging.
        if:
          - when: it shows low battery
            then: take the screen off the door, plug it into the USB-C charger on the nightstand inside the room, let it charge for the whole turnover (longer if you can), and put it back on the door before you leave.
          - when: "⚠️ BEN"
            then: "you mentioned redesigning the indicator to be more visible, or a diagram of where it sits on the screen — which?"

  - id: first-look
    title: First look
    steps:
      - id: lights
        title: Turn all the lights on
        photo: photos/final/hue-remote.jpg
        do:
          - Use the remote on the wall just to the right of the door — press the yellow power button.
          - Every lamp in the room should light up. A lamp that stays dark has been switched off at the lamp or unplugged — switch it back on / plug it in.
          - All lamps must be left powered ON. The lights are controlled remotely, and a lamp switched off at the lamp can't be controlled.
      - id: echo
        title: Check the speaker
        do:
          - Say "Computer, are you here?"
        if:
          - when: there is no response
            then: press the unmute button on top of the speaker and try again.
          - when: it says it's having trouble connecting
            then: tell Ben.
      - id: dishes-out
        title: Collect anything used
        do:
          - Used mugs, bowls, wine glasses, the French press, coffee things — anything on any surface — go to the kitchen sink.
          - Also check beside the kitchen sink for anything the guest already brought out of the room.
          - Throw away trash left on surfaces.
          - If the projector was left on, turn it off.
      - id: fridge-open
        title: Check the mini fridge
        photo: photos/final/mini-fridge.jpg
        do:
          - Guests are told to leave the fridge EMPTY and OPEN at checkout (it switches off at checkout and defrosts).
          - Take out anything left inside.
          - "There's a defrost dish inside: check it for water. It spills easily when pulled — stuff paper towels in first to soak it up, then pull it out and empty it."
          - Wipe the inside with a Clorox wipe.
          - Leave the fridge open for now — you close it at the very end.
        if:
          - when: the fridge was NOT left open
            then: tell Ben (the guest was asked to leave it open).
          - when: "⚠️ BEN"
            then: "where will the Clorox wipes live? (you said you'd set some aside — location TBD)"

  - id: bed-strip
    title: Strip the bed
    steps:
      - id: stains
        title: Look for new stains before you strip
        do:
          - "Check sheets, pillowcases, duvet cover and pillows. What counts: a big NEW bleach stain (small old ones exist — a large one is probably new) · a food stain · a body / oil stain · hair-product stains on the pillows."
          - "⚠️ BEN: you wanted this broken down clearly, maybe with an example image — which stains do you want photographed?"
        if:
          - when: you find one
            then: take a photo and send it to Ben.
      - id: strip
        title: Strip the sheets and pillowcases
        do:
          - Sheets and pillowcases go in the laundry bag (see "Laundry" at the end for where it is).
          - Throw pillows are NOT stripped or replaced — they get lint-rolled later.
        if:
          - when: a WHITE pillowcase is on over another pillowcase
            then: the guest opted into a bleaching skin product. The white one goes to laundry; the case underneath is clean — leave it on.
      - id: duvet-cover
        title: Decide about the duvet COVER
        do:
          - This is about the duvet COVER, not the duvet itself.
          - Normally the cover stays on — lint-roll it.
          - Replace it only for a fresh food or bodily stain, or if it smells off.
          - Some covers have bleached spots. Keep them facing down; if one ends up on top, cover it with the runner blanket.
        if:
          - when: you changed the duvet cover
            then: tell Ben — he tracks how many are clean so laundry gets timed right.

  - id: supplies
    title: Supplies under the bed
    steps:
      - id: containers
        title: Find what you need under the bed
        photo: photos/final/under-bed-containers.jpg
        do:
          - "Three BIG containers, side by side: duvet covers · towels · sheets."
          - "Three SMALL containers, one in front of each big one: hand towels + washcloths (in front of towels) · pillowcases (in front of sheets) · cleaning kit (in front of duvet covers)."
          - "⚠️ BEN: you said you'd verify which small bin is in front of which big one when you go in — and this needs the overhead photo (mattress off, containers outlined)."
      - id: cleaning-kit
        title: The cleaning kit
        do:
          - "Lint roller · water + a toothbrush for spot cleaning · pillow chocolates."
          - "⚠️ BEN: linen spray — you said probably leave it out. Anything else in the kit?"

  - id: vacuum
    title: Vacuum
    steps:
      - id: vacuum
        title: Quick vacuum
        photo: photos/final/vacuum.jpg
        do:
          - "The vacuum stick is in the kitchen. Its charging base is in the basement, on the tool wall."
          - Use the carpet attachment on the rugs.
          - Get obvious crumbs on the desk, the nightstand, and in or around the fridge.
          - "⚠️ BEN: your newer notes vacuum FIRST (clean floor before bedding — 'maybe overkill'); the old guide vacuums LAST. Placed here, after stripping. Move it?"
          - "⚠️ BEN: DG-619318 — vacuum + hampers still need to be placed where this says they are."

  - id: bed-make
    title: Make the bed
    steps:
      - id: sheets
        title: Fresh sheets
        photo: photos/final/07-bed-made.jpg
        do:
          - Fresh sheets from the sheets container.
          - The runner blanket goes across the foot of the bed, covering the bottom third to half.
          - "⚠️ BEN: what's in a sheet set — fitted + flat, or fitted only?"
      - id: pillows
        title: Pillows
        photo: photos/final/06-headboard.jpg
        do:
          - Three sleeping pillows, each with a fresh pillowcase, at the headboard.
          - Two square throw pillows in front of them, lint-rolled and arranged as pictured.
          - Spot-clean any marks on the throw pillows with the toothbrush + water from the kit.
          - The bed-care note on the headboard stays where it is.
          - Put a chocolate on the center pillow from the supply box if the old one was eaten; otherwise put the old one back.
        if:
          - when: something is growing on a throw pillow
            then: remove that pillow and tell Ben.
      - id: hammock
        title: Hammock chair
        photo: photos/final/08-hammock.jpg
        do:
          - Two canvas pillows on the bottom (to sit on), the round throw pillow at the back, the throw blanket folded as pictured. Guests move the blanket around.
      - id: containers-back
        title: Push the containers back
        do:
          - Push the under-bed containers all the way back so they can't be seen from the door.

  - id: window-wall
    title: Window wall
    steps:
      - id: window-wall
        title: Set the window wall
        photo: photos/final/09-window-wall.jpg
        do:
          - Curtains open and tucked behind the boat cleats.
          - Air conditioner powered OFF. (Unlocking the door turns its outlet on, so if the unit itself is on it will start — turn it off anyway.)
          - The lamp to the left of the window powered ON.
        if:
          - when: "⚠️ BEN"
            then: "space heater — you were deciding whether to put it on a controllable outlet tied to the AC outlet before leaving. If that lands, no heater step is needed here; if not, what should they do with it?"
      - id: remotes
        title: Remotes
        do:
          - The two remotes (projector + Apple TV) sit on the wooden dish on the left shelf.
        if:
          - when: a remote is missing
            then: it has fallen between the bed and the wall, or it's on the nightstand — those are the two usual places.
      - id: coffee-station
        title: Coffee and tea station
        do:
          - Three mugs hanging on their hooks.
          - Kettle emptied of water.
          - French press present and clean.
        if:
          - when: a mug is missing
            then: check around the kitchen sink; wash it and hang it back.
          - when: the French press is missing
            then: it's probably in the kitchen — clean it and put it back.

  - id: nightstand
    title: Nightstand
    steps:
      - id: nightstand
        title: Set the nightstand
        photo: photos/final/08-hammock.jpg
        do:
          - Noise machine on the "meadow" setting at a reasonable volume.
          - The accordion lamp on, aimed over the nightstand.
          - Charging cable draped over the top of the charging station.
          - "⚠️ BEN: charging station placement was undecided."
        if:
          - when: the noise machine is silent
            then: power it off and on again.

  - id: desk-wall
    title: Desk wall
    steps:
      - id: desk
        title: Set the desk
        photo: photos/final/desk.jpg
        do:
          - Wipe the desk with a damp paper towel.
          - The bin under the desk is empty, with no bag in it (guests use it as a hamper).
          - Desk lamp on, aimed as pictured. Guests bend it and knock the shade off — put the shade back on.
          - The recommendations book (the other-colored guide) next to the lamp, as pictured.
          - The water pitcher empty.
          - "⚠️ BEN: is the water pitcher still there? And where does the draft stopper hang — behind the door (your 9/23 floor-plan note) or 'on the left'?"

  - id: door-wall
    title: Door wall and check-in shelf
    steps:
      - id: towels
        title: Towels on the ladder
        photo: photos/final/10-towel-ladder.jpg
        do:
          - Two bath towels, one dark washcloth, one light washcloth, arranged as pictured.
          - Some guests never use their towels — if a towel is dry and looks unused, leave it. Look at the washcloths more closely.
          - Fresh ones come from the towels container and the hand-towel container under the bed.
      - id: check-in-shelf
        title: Check-in shelf
        photo: photos/final/11-checkin-shelf.jpg
        do:
          - Two wine glasses hanging under the shelf, two mugs on their hooks. If used, they're by the kitchen sink — wash and hang them back.
          - Rinse the toothbrush cup.
          - The guidebook goes in front of the check-in / check-out buttons, as pictured. Guests move it to the nightstand or the desk.
          - Both guides in place — the guidebook here, the recommendations book by the desk lamp.
          - "⚠️ BEN: the hanging tote of bathroom/shower products — guests leave things in it. Where do those go?"
      - id: purifier-snacks
        title: Air purifier and snacks
        do:
          - Air purifier ON, level 2.
          - Biscotti and Ricolas — if a jar is more than half empty, refill it. Refills are in the cocotte on Ben's stovetop.
          - "⚠️ BEN: photo of the cocotte / where refills live (you said it may change)."

  - id: closet
    title: Closet
    steps:
      - id: closet-products
        title: Bath products
        photo: photos/final/01-closet-shelf.jpg
        do:
          - Products arranged neatly on the shelf as pictured. Bring back anything the guest left in the bathroom.
        if:
          - when: a bottle feels completely empty
            then: throw it out and replace it with the full one of the same kind from behind it in the closet.
      - id: closet-rest
        title: The rest of the closet
        photo: photos/final/02-closet.jpg
        do:
          - Hair dryer hanging in its holster on the left inside wall of the closet.
          - "On top of the fridge: at least two of each — 2 plates, 2 bowls, 2 of each utensil."
          - "⚠️ BEN: you wanted to check the dish inventory in person, and to relocate / confirm the makeup wipes."

  - id: bathroom
    title: Bathroom
    steps:
      - id: bathroom-clean
        title: Clean the bathroom
        photo: photos/final/shower-set.jpg
        do:
          - Collect any clothing or products left behind (products go back to the closet shelf).
          - Hair off the shower wall and out of the sink.
          - Toothpaste off the mirror and around it; wipe the sink.
          - Brush the toilet once over — the brush is next to the toilet.
          - Scrub the shower if it needs it.
          - "⚠️ BEN: needs a CURRENT photo of the shower as it should look this trip (you're hiding your products)."
      - id: bathroom-supplies
        title: Toilet paper, soap, trash
        photo: photos/final/tp-backup.jpg
        do:
          - Toilet paper on the holder AND a backup roll present. Backups are in the stocked supply — never buy.
          - Hand soap dispenser full. Refill is under the sink, in the black bag — squeeze it into the dispenser.
          - "⚠️ BEN: where exactly is the backup TP kept? (photo)"
        if:
          - when: the bathroom trash is fairly full
            then: empty it; new bags are under the current bag.

  - id: finish
    title: Finish
    steps:
      - id: trash
        title: Trash out
        do:
          - Empty the room's trash basket. The roll of new bags is in the bin, under the current bag (inside the room, not outside).
          - Take the bags out to the front gated area of the building.
      - id: fridge-close
        title: Close the fridge
        do:
          - Close the mini fridge now that it's defrosted and wiped.
      - id: last-look
        title: Last look
        do:
          - Every lamp on. Curtains open. Remotes on the dish. Both guides in place. Purifier on. Containers pushed back.
          - Take a photo of the finished room and send it to Ben.
      - id: leave
        title: Lock up and mark it done
        photo: photos/final/turnover-button.jpg
        do:
          - Put the door screen back on the door if you had it charging.
          - Lock the bolt.
          - Press the turnover button on the right, just outside the door, ONCE. That tells Ben the turnover is done.
          - If you pressed it by mistake, a double press undoes it.
          - "⚠️ BEN: interactive version — you want 'submit done' in the app first, and the button only as fallback; print keeps the button. Do NOT mention the long-press (vacuum)."

  - id: laundry
    title: Laundry
    steps:
      - id: laundry-bag
        title: Where the laundry bag is
        photo: photos/final/laundry-closet.jpg
        do:
          - "Ben may have left the black laundry backpack in the kitchen for you, or in the hallway outside it. If it isn't there, it's outside the apartment at the end of the hall: down the hallway to the left, behind the keypad door, hanging on the wall."
          - "⚠️ BEN: the keypad code goes on the binder card / by text — not here. And you wanted this as an appendix with photos of the hall door."
          - "⚠️ BEN: this trip, hampers go in the hallway outside your apartment — is that where the laundry bag lives for S&S, replacing both versions above?"
      - id: laundry-full
        title: When laundry needs to go out
        do:
          - "Send the laundry out when ANY of these is true: the laundry bag is nearly full · only two sheet sets are left · only three towels are left."
          - Bring the full bag (or two) into Ben's hallway and lean it against the wall near the mail. Text Ben — he schedules the pickup.
          - The laundry comes back in the same bags, folded, a few days later. Put everything back in the right containers under the bed.

  - id: plants
    title: Plants (only if Ben asked you)
    steps:
      - id: plants
        title: Water the plants
        do:
          - Not every turnover includes this — only if Ben asked you.
          - Don't stand on the wicker chair — use the folding step stool (by the robe hook).
          - Send Ben a photo of the plants so he can see how they look.
          - "⚠️ BEN: which plants, how much, how often — this overlaps the house-sitter watering guide you still have to write. Own page, per your 9/23 note."
