<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="780" height="420" fill="#ffffff"/>
  <!-- lock body -->
  <rect x="60" y="30" width="200" height="360" rx="28" fill="#2b2b2b"/>
  <!-- keypad -->
  <g fill="#1a1a1a" stroke="#666" stroke-width="1.5">
    <rect x="86" y="60" width="148" height="190" rx="12"/>
  </g>
  <g fill="#f2f2f2" font-size="22" text-anchor="middle">
    <text x="113" y="100">1</text><text x="160" y="100">2</text><text x="207" y="100">3</text>
    <text x="113" y="145">4</text><text x="160" y="145">5</text><text x="207" y="145">6</text>
    <text x="113" y="190">7</text><text x="160" y="190">8</text><text x="207" y="190">9</text>
    <text x="160" y="235">0</text>
  </g>
  <!-- key slot -->
  <ellipse cx="160" cy="280" rx="14" ry="14" fill="#111" stroke="#777" stroke-width="1.5"/>
  <rect x="157" y="280" width="6" height="16" fill="#777"/>
  <!-- bean-shaped button -->
  <path d="M120 330 C120 314, 140 310, 160 314 C180 310, 200 314, 200 330 C200 348, 180 354, 160 350 C140 354, 120 348, 120 330 Z" fill="#c9a227" stroke="#8a6d10" stroke-width="2"/>
  <!-- callouts -->
  <g stroke="#2f5d50" stroke-width="2.5" fill="none">
    <path d="M250 150 L330 150"/>
    <path d="M250 280 L330 240"/>
    <path d="M210 335 L330 335"/>
  </g>
  <g fill="#1f1d1a" font-size="19">
    <text x="340" y="145">1. Enter the code on the keypad</text>
    <text x="340" y="234">Key slot — you won't need it</text>
    <text x="340" y="330" font-weight="bold">2. Then press the bean-shaped button</text>
    <text x="340" y="356">at the bottom. This is what unlocks the door.</text>
  </g>
  <text x="60" y="410" font-size="13" fill="#5c5750">Schematic of the Ultraloq U-Bolt keypad, not to scale — drawn by Claude from Ben's description, not a product image.</text>
</svg>
